<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PetriNet Editor: free online Petri net simulator</title>
    <meta
      name="description"
      content="Draw Petri nets in your browser, fire transitions step by step, and check liveness, boundedness and invariants. Free, no install, no account. Exports PNML and images."
    />
    <meta name="author" content="Mateusz Anikiej" />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Theme before the first paint, so a dark page never flashes white. It must match
         src/store/themeStore.ts (key, query, colours); themeStore.test.ts checks that. -->
    <script>
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("petrinet:theme");
        } catch {}
        const dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia?.("(prefers-color-scheme: dark)").matches === true);
        const root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#0f172a" : "#ffffff";
      })();
    </script>
    <link rel="canonical" href="https://petrinet.anikiej.com/" />
